schema_version = 2

[run]
name = "long-context-discovery"
suite = "discovery"
artifact_root = "runs"
seed = 42

[training]
seconds = 300.0
tokens = 0
depth = 6
head_dim = 128
sequence_length = 4096
device_batch_size = 2
total_batch_size = 32768
window_pattern = "L"
sliding_window = 256
force_final_full = true
eval_tokens = 1048576
precision = "bfloat16"
