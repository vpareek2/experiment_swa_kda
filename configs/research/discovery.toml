schema_version = 2

[run]
name = "discovery"
suite = "discovery"
artifact_root = "runs"
seed = 42

[training]
seconds = 300.0
tokens = 0
depth = 6
head_dim = 128
sequence_length = 1024
device_batch_size = 8
total_batch_size = 32768
window_pattern = "L"
sliding_window = 256
force_final_full = true
eval_tokens = 1048576
precision = "bfloat16"
kda_backend = "fla_triton"


[evaluation]
enabled = true
protocol = "general_lm"
context_lengths = [128, 256, 512, 1024]
target_tokens = 64
max_documents = 128
core_enabled = true
ruler_enabled = false
ruler_manifest = ""
ruler_manifest_sha256 = ""
core_max_per_task = 100

[decision]
bpb_floor = 0.002
throughput_floor_fraction = 0.03
memory_floor_fraction = 0.02
baseline_seeds = [11, 23, 37, 53, 71]
internal_promotion_seeds = [101, 211, 307]
confirmation_seed_count = 5

[protection]
allowed_paths = ["nanochat/gpt.py", "nanochat/mixers/", "configs/candidates/"]
protected_paths = [
  "nanochat/research/",
  "configs/research/",
  "scripts/base_eval.py",
  "nanochat/core_eval.py",
  "nanochat/loss_eval.py",
  "nanochat/dataloader.py",
  "nanochat/dataset.py",
  "nanochat/tokenizer.py",
]
